services:
  - type: web
    name: vehicle-life-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    numInstances: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: TOP_GARAGES_CHANNEL_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
